<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <p class="sidebar-mark">PORTFOLIO</p>
        <h1 id="profile-name" class="sidebar-name">Loading…</h1>
        <p id="profile-title" class="sidebar-role"></p>
      </div>

      <nav class="sidebar-nav">
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>

      <div class="sidebar-links" id="profile-links"></div>
    </aside>

    <!-- Main content -->
    <main class="content">

      <section id="about" class="section">
        <span class="section-index">01</span>
        <h2 class="section-heading">About</h2>
        <p id="profile-bio" class="bio-text">Fetching profile…</p>
      </section>

      <section id="skills" class="section">
        <span class="section-index">02</span>
        <h2 class="section-heading">Skills</h2>
        <div id="skills-groups" class="skills-groups"></div>
      </section>

      <section id="projects" class="section">
        <span class="section-index">03</span>
        <h2 class="section-heading">Projects</h2>
        <ol id="projects-list" class="projects-list"></ol>
      </section>

      <section id="contact" class="section">
        <span class="section-index">04</span>
        <h2 class="section-heading">Contact</h2>
        <p class="contact-intro">Have a project in mind, or just want to say hello? Send a message below.</p>

        <form id="contact-form" class="contact-form">
          <label>
            Name
            <input type="text" name="name" required />
          </label>
          <label>
            Email
            <input type="email" name="email" required />
          </label>
          <label>
            Message
            <textarea name="message" rows="5" required></textarea>
          </label>
          <button type="submit">Send message</button>
          <p id="form-status" class="form-status" role="status"></p>
        </form>
      </section>

      <footer class="footer">
    <p>Built with HTML, CSS, JavaScript, PHP, MySQL, and Java Swing.</p>
</footer>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
